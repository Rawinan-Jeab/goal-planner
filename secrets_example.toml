# Copy this into Streamlit Community Cloud: App settings > Secrets
# (or into .streamlit/secrets.toml on your own computer). NEVER upload real values to GitHub.

# Google login. Remove this whole [auth] section to use the demo login instead.
[auth]
redirect_uri = "https://YOUR-APP.streamlit.app/oauth2callback"
cookie_secret = "PUT-A-LONG-RANDOM-TEXT-HERE"
client_id = "xxxxxxxx.apps.googleusercontent.com"
client_secret = "GOCSPX-xxxxxxxx"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

# Online database (Supabase). Remove this section to use a local SQLite file instead.
# Use the "Session pooler" connection string from Supabase, with your database password in it.
[database]
url = "postgresql://postgres.YOUR-PROJECT-REF:YOUR-PASSWORD@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres"
